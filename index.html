<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I'm So Sorry 💐</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Lora', serif;
      overflow-x: hidden;
      background: #fff0f5;
    }

    #page1 {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 2rem;
    }

    .flower-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .flower {
      position: absolute;
      animation: sway 4s ease-in-out infinite, fadeIn 1s ease forwards;
      opacity: 0;
      user-select: none;
    }
    @keyframes sway {
      0%, 100% { transform: rotate(-8deg) scale(1); }
      50%       { transform: rotate(8deg) scale(1.08); }
    }
    @keyframes fadeIn { to { opacity: 1; } }

    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255,160,180,0.35);
      border-radius: 28px;
      padding: 3rem 2.5rem 2.5rem;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 48px rgba(220,100,130,0.12);
      animation: cardIn 0.9s cubic-bezier(0.22,1,0.36,1) forwards;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .hearts-row { font-size: 1.5rem; letter-spacing: 6px; margin-bottom: 1.2rem; }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.3rem, 4vw, 1.9rem);
      color: #c0304a;
      line-height: 1.55;
      margin-bottom: 1.4rem;
      font-weight: 700;
    }
    .subtitle {
      font-size: 1rem; color: #b06070;
      margin-bottom: 2rem; font-style: italic;
    }

    .btn-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1.4rem;
      flex-wrap: wrap;
    }

    .btn-forgive {
      background: linear-gradient(135deg, #e8556a, #c0304a);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 0.9rem 2.2rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      cursor: pointer;
      transition: transform 0.18s, box-shadow 0.18s;
      box-shadow: 0 4px 18px rgba(192,48,74,0.32);
      letter-spacing: 0.02em;
    }
    .btn-forgive:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 26px rgba(192,48,74,0.45);
    }

    /* wrapper holds space even as button shrinks so layout never shifts */
    .dont-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      min-width: 140px;
      min-height: 52px;
    }

    #dontBtn {
      background: transparent;
      color: #c0304a;
      border: 1.5px solid #e8556a;
      border-radius: 50px;
      padding: 0.9rem 2.2rem;
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      cursor: pointer;
      letter-spacing: 0.02em;
      white-space: nowrap;
      transform-origin: center;
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s ease;
    }

    #jokeText {
      font-size: 0.75rem;
      color: #e8556a;
      font-style: italic;
      min-height: 1.1em;
      transition: opacity 0.3s;
    }

    /* ── Page 2 ── */
    #page2 {
      display: none;
      min-height: 100vh;
      background: linear-gradient(160deg, #fff5f8 0%, #ffe8f0 50%, #fff0e0 100%);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 2rem;
    }
    #page2.show { display: flex; animation: bgFade 1s ease; }
    @keyframes bgFade { from { opacity: 0; } to { opacity: 1; } }

    .kid-scene {
      position: relative;
      width: min(340px, 90vw);
      margin-bottom: 2rem;
    }
    .kid-svg {
      width: 100%;
      filter: drop-shadow(0 8px 24px rgba(200,80,100,0.18));
      animation: kidBounce 2.5s ease-in-out infinite;
    }
    @keyframes kidBounce {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-10px); }
    }
    .bubble {
      position: absolute;
      top: -18px; right: -10px;
      background: #fff;
      border: 2px solid #f4a0b0;
      border-radius: 18px;
      padding: 0.6rem 1.1rem;
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: #c0304a;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(200,80,100,0.12);
    }
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -12px; left: 28px;
      border-width: 12px 8px 0;
      border-style: solid;
      border-color: #fff transparent transparent;
    }
    .thankyou-text {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 6vw, 3.2rem);
      color: #c0304a; margin-bottom: 0.5rem;
      animation: pop 0.7s cubic-bezier(0.22,1,0.36,1);
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.6); }
      to   { opacity: 1; transform: scale(1); }
    }
    .thankyou-sub { font-size: 1.1rem; color: #b06070; font-style: italic; }

    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 99; }
    .conf {
      position: absolute;
      animation: confFall linear forwards;
    }
    @keyframes confFall {
      0%   { transform: translateY(-40px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(100vh)  rotate(720deg); opacity: 0; }
    }
    .flower-p2 {
      position: fixed; pointer-events: none;
      animation: sway 5s ease-in-out infinite, fadeIn 1.2s ease forwards;
      opacity: 0;
    }
  </style>
</head>
<body>

<!-- PAGE 1 -->
<div id="page1">
  <div class="flower-bg" id="flowerBg"></div>

  <div class="card">
    <div class="hearts-row">🌸 🌸</div>
    <h1>"I'm really very sorry... I didn't mean what I said. I just said it for fun."</h1>
    <p class="subtitle">believe me — it came from a silly place, not really what i meant. Will you please forgive me?</p>

    <div class="btn-row">
      <button class="btn-forgive" onclick="goToPage2()">I Forgive You</button>

      <div class="dont-wrap">
        <button id="dontBtn" onclick="shrinkDont()">I Don't 🙅</button>
        <span id="jokeText"></span>
      </div>
    </div>
  </div>
</div>

    <div class="bubble">Thank you so much! 🌸</div>
  </div>
  <div class="thankyou-text">You're the best!</div>
  <p class="thankyou-sub">Did not really know you were full, Sorry. 🌷</p>
</div>

<script>
  // ── Flower background ──
  const flowerEmojis = ['🌹','🌸','🌺','🌼','🌻','💐','🌷','🏵️'];
  const bg = document.getElementById('flowerBg');
  for (let i = 0; i < 55; i++) {
    const el = document.createElement('div');
    el.className = 'flower';
    el.textContent = flowerEmojis[i % flowerEmojis.length];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.top  = Math.random() * 100 + 'vh';
    el.style.fontSize = (1.4 + Math.random() * 2) + 'rem';
    el.style.animationDelay    = (Math.random() * 4) + 's';
    el.style.animationDuration = (3 + Math.random() * 4) + 's';
    bg.appendChild(el);
  }

  // ── Shrinking "I Don't" button ──
  const dontBtn  = document.getElementById('dontBtn');
  const jokeText = document.getElementById('jokeText');

  const scales = [1, 0.75, 0.52, 0.33, 0.17, 0];
  const jokes  = [
    '',
    'think again… 😏',
    'shrinking! 😅',
    'getting tiny… 🤏',
    'almost gone! 😂',
    'poof! totally gone 🫧😂'
  ];
  let step = 0;

  function shrinkDont() {
    if (step >= scales.length - 1) return;
    step++;
    const s = scales[step];
    dontBtn.style.transform = `scale(${s})`;
    dontBtn.style.opacity   = String(Math.max(s, 0.08));
    jokeText.textContent    = jokes[step];
    if (s === 0) dontBtn.style.pointerEvents = 'none';
  }

  // ── Page 2 ──
  function goToPage2() {
    document.getElementById('page1').style.display = 'none';
    document.getElementById('page2').classList.add('show');
    spawnConfetti();
    spawnFlowersP2();
  }

  function spawnConfetti() {
    const wrap   = document.getElementById('confetti');
    const colors = ['#e8556a','#f4a0b0','#ffd070','#80d8b0','#a0c8f8','#c8a0f8','#fff'];
    for (let i = 0; i < 90; i++) {
      const c = document.createElement('div');
      c.className = 'conf';
      c.style.left      = Math.random() * 100 + 'vw';
      c.style.top       = '-20px';
      c.style.width     = (6 + Math.random() * 8) + 'px';
      c.style.height    = (6 + Math.random() * 8) + 'px';
      c.style.background    = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius  = Math.random() > 0.5 ? '50%' : '2px';
      c.style.animationDuration = (2 + Math.random() * 3) + 's';
      c.style.animationDelay    = (Math.random() * 2) + 's';
      wrap.appendChild(c);
    }
  }

  function spawnFlowersP2() {
    const p2 = document.getElementById('page2');
    for (let i = 0; i < 20; i++) {
      const el = document.createElement('div');
      el.className  = 'flower-p2';
      el.textContent = flowerEmojis[i % flowerEmojis.length];
      el.style.left     = Math.random() * 100 + 'vw';
      el.style.top      = Math.random() * 100 + 'vh';
      el.style.fontSize = (1.2 + Math.random() * 1.8) + 'rem';
      el.style.animationDelay    = Math.random() * 2 + 's';
      el.style.animationDuration = (4 + Math.random() * 3) + 's';
      p2.appendChild(el);
    }
  }
</script>

</html>
